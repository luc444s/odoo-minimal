services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: odoo:17.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    command: ["-i", "base", "-d", "odoo", "--data-dir=/run/odoo"]
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - web_data:/var/lib/odoo
    networks: [internal]
networks:
  internal:
    internal: true
volumes:
  db_data:
  web_data:
